name: Steward PR Scan

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repositories to scan (comma-separated owner/repo)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no comments posted)'
        required: false
        type: boolean
        default: false

jobs:
  scan-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Configure GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run PR scanner (config mode)
        if: github.event.inputs.repos == ''
        run: |
          python3 scripts/steward_scan_prs_config.py \
            --config setup/pr-scan-repos.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PR scanner (manual repos)
        if: github.event.inputs.repos != ''
        run: |
          REPOS=$(echo "${{ github.event.inputs.repos }}" | tr ',' ' ')
          python3 scripts/steward_scan_prs.py \
            --repos $REPOS \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload scan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-scan-summary
          path: ~/.config/steward-os/pr-scan-summary.json
          retention-days: 7
