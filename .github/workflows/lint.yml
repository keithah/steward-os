name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Unit tests
        run: |
          shopt -s nullglob
          files=(test/*_test.rb)
          if [ ${#files[@]} -eq 0 ]; then echo "no test files found"; exit 1; fi
          for f in "${files[@]}"; do echo "== $f"; ruby "$f" || exit 1; done
        shell: bash
      - name: Skills-contract lint
        run: ./bin/skills-contract-lint
      - name: Config-contract lint
        run: ./bin/config-lint
