name: Steward PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  scan-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Steward review for this PR
        run: |
          python3 scripts/steward_scan_prs.py \
            --repos "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload scan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-pr-${{ github.event.pull_request.number }}-summary
          path: ~/.config/steward-os/pr-scan-summary.json
          if-no-files-found: ignore
          retention-days: 7
